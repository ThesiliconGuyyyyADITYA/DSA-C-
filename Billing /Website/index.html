<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxosmith BillDesk</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-logo">
        <img src="logo.png" alt="Maxosmith Logo">
        <div><h3>MAXOSMITH</h3><span>BillDesk</span></div>
    </div>

    <div class="container">
        <div class="left">
            <p class="tagline">
                Smart Billing System<br><br>
                Inventory Management<br><br>
                Retailer Orders<br><br>
                Ledger &amp; Reports
            </p>
        </div>

        <div class="right">
            <div class="login-box">
                <div id="loginPanel">
                    <img src="logo.png" class="logo" alt="Maxosmith Logo">
                    <h2>Welcome Back</h2>
                    <p>Login to continue</p>

                    <form id="loginForm">
                        <div class="input-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="Enter Username" autocomplete="username" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Password</label>
                            <div class="password-box">
                                <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password" required>
                                <button type="button" class="show-password" id="showPassword">Show</button>
                            </div>
                        </div>

                        <button type="submit" id="loginButton">LOGIN</button>
                        <button type="button" class="text-action-button" id="forgotPasswordButton">Forgot password?</button>
                        <div id="message" aria-live="polite"></div>
                    </form>
                </div>

                <div id="resetPanel" class="hidden-panel">
                    <img src="logo.png" class="logo small-logo" alt="Maxosmith Logo">
                    <h2>Reset Password</h2>
                    <p>Verify your registered phone number to create a new password.</p>

                    <form id="resetPasswordForm">
                        <div class="input-group">
                            <label for="resetUsername">Username</label>
                            <input type="text" id="resetUsername" placeholder="Enter Username" autocomplete="username" required>
                        </div>

                        <div class="input-group">
                            <label for="registeredPhone">Registered Phone Number</label>
                            <input type="tel" id="registeredPhone" placeholder="Enter Registered Phone Number" inputmode="numeric" autocomplete="tel" maxlength="15" required>
                        </div>

                        <div class="input-group">
                            <label for="newPassword">New Password</label>
                            <div class="password-box">
                                <input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password" required>
                                <button type="button" class="show-password" id="showNewPassword">Show</button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirmNewPassword">Confirm New Password</label>
                            <div class="password-box">
                                <input type="password" id="confirmNewPassword" placeholder="Re-enter New Password" autocomplete="new-password" required>
                                <button type="button" class="show-password" id="showConfirmNewPassword">Show</button>
                            </div>
                        </div>

                        <button type="submit" id="resetPasswordButton">RESET PASSWORD</button>
                        <button type="button" class="text-action-button" id="backToLoginButton">Back to login</button>
                        <div id="resetMessage" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
